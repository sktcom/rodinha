<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rodinha – divulgue seu grupo de WhatsApp</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#FF3D9A"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Fraunces:ital,wght@1,700&display=swap">
<style>
:root{--bg:#EEF2DA;--surf:#FFFDF4;--g1:#C9D4A3;--g2:#7E9A4B;--g3:#5E7A33;--ink:#2F3B26;--mut:#6B7560;--pk:#FF3D9A;--pk2:#D41F78;--pl:#FADCE4;--cr:#FBF3D5;--sh:rgba(47,59,38,.13);--sans:Poppins,system-ui,sans-serif;--ser:Fraunces,Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D2417;--surf:#2A3322;--g1:#4A5B33;--g2:#A9C46F;--g3:#C4DA8E;--ink:#F4F1DC;--mut:#A9B39A;--pl:#4A2A38;--cr:#3A3822;--sh:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1D2417;--surf:#2A3322;--g1:#4A5B33;--g2:#A9C46F;--g3:#C4DA8E;--ink:#F4F1DC;--mut:#A9B39A;--pl:#4A2A38;--cr:#3A3822;--sh:rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--sans);max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:78px}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.1}
em{font-family:var(--ser);font-style:italic;font-weight:700;color:var(--pk)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
.i3{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(40,50,20,.22))}
header{padding:14px 16px 4px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;letter-spacing:-.04em}
.logo span{width:30px;height:30px}
.hb{width:38px;height:38px;border-radius:50%;background:var(--surf);box-shadow:0 4px 10px var(--sh);padding:7px;position:relative}
main{padding:0 16px}
.search{display:flex;gap:8px;align-items:center;background:var(--surf);border-radius:18px;padding:9px 14px;box-shadow:0 4px 12px var(--sh);margin:8px 0 12px}
.search span{width:20px;height:20px;flex:none}
.search input{border:0;background:none;flex:1;outline:0;min-width:0;font-size:14px}
.sts{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:6px 16px 14px;scroll-padding:0 16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}.sts::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}.sts::after,.hs::after{content:"";flex:none;width:4px}
.st{flex:none;scroll-snap-align:start;width:66px;text-align:center;font-size:10.5px;font-weight:600;color:var(--mut);white-space:nowrap;display:flex;flex-direction:column;align-items:center}
.st b{display:block;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;padding:11px;background:linear-gradient(145deg,var(--cr),var(--pl));box-shadow:inset 0 -4px 7px #0001,0 4px 9px var(--sh);border:2px solid transparent;background-origin:border-box}
.st[aria-pressed=true]{color:var(--ink)}.st[aria-pressed=true] b{border-color:var(--pk)}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--pl),var(--cr));border-radius:26px;padding:18px;margin-bottom:16px;box-shadow:0 8px 20px var(--sh)}
.hero h1{font-size:26px;max-width:62%}
.hero p{font-size:12.5px;color:var(--mut);max-width:58%;margin:6px 0 12px}
.hero .f{position:absolute}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.sec h3{font-size:16px}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 16px;scroll-padding:0 16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ft{flex:none;scroll-snap-align:start;width:132px;border-radius:22px;padding:12px;min-height:128px;position:relative;box-shadow:0 6px 14px var(--sh);cursor:pointer;text-align:left}
.ft:nth-child(3n+1){background:var(--g1)}.ft:nth-child(3n+2){background:var(--pl)}.ft:nth-child(3n){background:var(--cr)}
.ft .ic{width:46px;height:46px;margin-bottom:12px}
.ft h3{font-size:13.5px;color:#2F3B26}.ft div{font-size:11px;color:#4d5a40}
.tabs{display:inline-flex;gap:3px;background:var(--surf);border-radius:16px;padding:3px;box-shadow:0 3px 8px var(--sh);margin-bottom:12px}
.tabs button{padding:6px 14px;border-radius:13px;font-size:12.5px;font-weight:600;color:var(--mut)}
.tabs button[aria-selected=true]{background:linear-gradient(180deg,#b9cd82,var(--g2));color:#fff;box-shadow:inset 0 1px 2px #fff6}
.card{background:var(--surf);border-radius:20px;padding:10px 12px;margin-bottom:9px;box-shadow:0 5px 14px var(--sh);display:flex;gap:11px;align-items:center;cursor:pointer}
.ico{flex:none;width:46px;height:46px;border-radius:15px;padding:8px;background:linear-gradient(145deg,var(--cr),var(--pl));box-shadow:inset 0 -3px 6px #0001}
.cb{flex:1;min-width:0}
.card h3{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3 s{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-left:4px}
.meta{color:var(--mut);font-size:12px}
.lk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.lk s{width:16px;height:16px}
.btn{background:linear-gradient(180deg,#ff72b8,var(--pk) 45%,var(--pk2));color:#fff;font-weight:800;font-size:13.5px;border-radius:18px;padding:10px 18px;box-shadow:inset 0 2px 3px #fff6,0 6px 12px #ff3d9a44}
.btn.w{width:100%;padding:12px}
.btn.s{padding:7px 13px;font-size:12px}
.ghost{background:var(--surf);border-radius:14px;padding:6px 11px;font-size:12px;font-weight:600;box-shadow:0 2px 6px var(--sh);display:inline-flex;align-items:center;gap:5px}
.ghost s{width:15px;height:15px}
.ghost[aria-pressed=true]{background:var(--pl)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;align-items:flex-end;background:var(--surf);padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;box-shadow:0 -6px 18px var(--sh)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mut);padding:2px 10px;position:relative;font-weight:600}
nav button s{width:24px;height:24px;opacity:.75}
nav button[aria-current=page]{color:var(--g3)}nav button[aria-current=page] s{opacity:1}
nav .plus s{width:46px;height:46px;margin-top:-22px;opacity:1}
.dot{position:absolute;top:0;right:12px;background:var(--pk);color:#fff;border-radius:9px;font-size:9px;padding:0 5px;font-weight:800}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.in{width:100%;background:var(--surf);border:2px solid transparent;border-radius:15px;padding:10px 13px;box-shadow:0 3px 8px var(--sh);font-size:14px}
.in:focus{border-color:var(--g2);outline:0}
.hint{font-size:11.5px;color:var(--mut);margin-top:4px}
.err{color:var(--pk2);font-size:12.5px;margin-top:8px;font-weight:600}
.sheet{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.cm{background:var(--surf);border-radius:14px;padding:8px 11px;margin-top:7px;font-size:13px}
.bar{height:7px;border-radius:5px;background:var(--g1);margin:-3px 10px 10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--pk))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--surf);border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 4px 10px var(--sh);font-size:11px;color:var(--mut)}
.stats b{display:block;font-size:20px;color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:28px 12px}
.empty .ic{width:70px;height:70px;margin:0 auto 10px}
.tip{display:flex;gap:12px;align-items:center;background:var(--g1);border-radius:22px;padding:14px;margin:8px 0 14px;color:#2F3B26}
.tip .ic{flex:none;width:52px;height:52px}.tip h3{font-size:14px}.tip p{font-size:12px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:16px;z-index:30;font-weight:600;font-size:13px}
.ico{overflow:hidden}
.promo{display:flex;gap:12px;align-items:center;background:var(--surf);border-radius:22px;padding:12px;margin-bottom:10px;box-shadow:0 5px 14px var(--sh)}.promo .ic{width:46px;height:46px;flex:none}.promo .cb{flex:1}.promo h3{font-size:12.5px}.promo p{font-size:10.5px;color:var(--mut);white-space:normal;line-height:1.35}.promo .btn.s{padding:6px 11px;font-size:11px}.code{display:inline-block;background:var(--pl);color:var(--pk2);font-weight:800;border-radius:9px;padding:0 7px;letter-spacing:.08em}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ct{background:var(--surf);border-radius:16px;padding:7px 2px 6px;font-size:10px;font-weight:600;color:var(--mut);box-shadow:0 3px 8px var(--sh);border:2px solid transparent;white-space:nowrap}
.ct i{display:block;width:34px;height:34px;margin:0 auto 3px}
.ct[aria-pressed=true]{border-color:var(--pk);color:var(--ink);background:var(--pl)}
.ph{display:flex!important;gap:12px;align-items:center;background:var(--surf);border-radius:18px;padding:10px;box-shadow:0 3px 8px var(--sh);cursor:pointer;margin:0!important}
.pv{width:60px;height:60px;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,var(--cr),var(--pl));padding:10px;flex:none}
.pv.full{padding:0}.pv img{width:100%;height:100%;object-fit:cover;display:block}
.ck{display:flex!important;gap:9px;align-items:flex-start;font-weight:400!important;font-size:12px!important;background:var(--cr);border-radius:16px;padding:10px 12px}
.ck input{width:18px;height:18px;accent-color:var(--pk);flex:none;margin-top:1px}
.ck a{color:var(--pk2);font-weight:600}
.bn{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--g1),var(--cr));border-radius:22px;padding:10px 12px;margin-bottom:12px;box-shadow:0 5px 14px var(--sh);color:#2F3B26}
.bn i{width:48px;height:48px;flex:none}.bn div{flex:1}.bn h3{font-size:15px}.bn p{font-size:11.5px}
.lg{background:var(--surf);border-radius:20px;padding:14px;box-shadow:0 4px 12px var(--sh);font-size:13px}.lg h3{font-size:14px;margin:12px 0 3px}.lg h3:first-child{margin-top:0}.lg li{margin:3px 0 3px 16px}
@media (prefers-reduced-motion:no-preference){.sheet>div{animation:up .25s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}.hero .f{animation:fl 4s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-6px) rotate(4deg)}}}

.toast{z-index:60}
.ov{position:fixed;inset:0;z-index:40}
.ovm{background:#0003}
.pop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);right:max(14px,calc((100vw - 520px)/2 + 14px));width:232px;background:var(--surf);border-radius:22px;padding:14px;box-shadow:0 12px 28px var(--sh),0 0 0 2px var(--pl)}
.pop h3{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}.pop h3 s{width:26px;height:26px;display:block;text-decoration:none}
.pop .ghost{width:100%;justify-content:flex-start;margin-top:7px;padding:10px 13px;font-size:13px}
.pop .ghost.dg{color:var(--pk2);background:var(--pl)}
.ovc{background:#0009;display:flex;align-items:center;justify-content:center;padding:18px}
.cp{background:var(--bg);width:min(480px,100%);max-height:88vh;border-radius:28px;padding:18px 16px;display:flex;flex-direction:column;box-shadow:0 14px 40px #0006}
.cp h2{margin-bottom:10px}.cl{overscroll-behavior:contain;overflow:auto;flex:1;display:flex;flex-direction:column;gap:7px;margin-bottom:14px;padding:2px}
.cr{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:16px;padding:8px 12px;box-shadow:0 3px 8px var(--sh);border:2px solid transparent;font-weight:600;font-size:13.5px;text-align:left}
.cr i{width:34px;height:34px;flex:none}
.cr[aria-pressed=true]{border-color:var(--pk);background:var(--pl)}
.ovf{background:rgba(120,20,70,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px}
.fp{position:relative;width:min(400px,100%);border-radius:34px;padding:24px 20px 18px;text-align:center;background:linear-gradient(160deg,#fff0f7 0%,#ffc2e0 55%,#ff8fc4 100%);color:#5a1038;box-shadow:0 16px 40px rgba(212,31,120,.4),inset 0 0 0 3px #fff8;overflow:hidden}
.fp .fi{width:80px;height:80px;margin:0 auto 4px;position:relative}
.fp .fd{position:absolute;width:34px;height:34px;opacity:.55}
.fp h2{font-size:22px;color:#a3145b;position:relative}
.fp p{font-size:13px;margin:6px 0 8px;color:#7a2250;position:relative}
.fp label{color:#8a1a55;text-align:left;position:relative}
.fp .in{background:#fff;border:2px solid #ffd0e6;border-radius:20px;text-align:center;position:relative}
.fp .in:focus{border-color:#ff3d9a}
.fp .err{color:#c0105e;position:relative}
.fp .btn{margin-top:14px;position:relative}.fp .btn[disabled]{opacity:.6}
.fp .bt{font-weight:700;font-size:12.5px;color:#a3145b;text-decoration:underline;margin-top:8px;padding:6px;position:relative}
.fgl{color:var(--pk2);font-weight:600;font-size:12.5px;text-decoration:underline;padding:6px}
.mew{display:flex;flex-direction:column;min-height:calc(100vh - 140px)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pp .18s ease-out}.fp{animation:up .25s ease-out}.ovc{animation:fi .55s ease both}.cp{animation:fz .7s cubic-bezier(.22,1,.36,1) both}.ovc.out{animation:fo .35s ease both}.ovc.out .cp{animation:none}@keyframes fi{from{opacity:0}}@keyframes fo{to{opacity:0}}@keyframes fz{from{opacity:0;transform:scale(.97)}}@keyframes pp{from{transform:scale(.92) translateY(-6px);opacity:0}}}

.pban{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0;padding:12px 14px;border-radius:22px;text-align:left;color:#fff;background:linear-gradient(135deg,var(--pk),var(--pk2));box-shadow:0 8px 20px var(--sh)}
.pban i{width:38px;height:38px;flex:none;display:block}
.pban span{flex:1;display:flex;flex-direction:column;font-size:12px;line-height:1.3}.pban span b{font-size:15px}
.pban em{font-style:normal;background:#fff;color:var(--pk2);font-weight:800;font-size:12px;border-radius:99px;padding:6px 12px}
.pplus{text-align:center;color:#fff;border-radius:28px;padding:22px 16px;margin:6px 0 12px;background:linear-gradient(150deg,var(--pk),var(--pk2));box-shadow:0 10px 24px var(--sh)}
.pplus .pi{width:56px;height:56px;margin:0 auto 4px}.pplus h1{font-size:40px;color:#fff}.pplus h1 small{font-size:15px;font-weight:600}.pplus p{font-size:13px;opacity:.95}
.pl{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.pl li{background:var(--surf);border-radius:16px;padding:11px 14px;font-size:13px;box-shadow:0 3px 8px var(--sh)}
.pixbox{background:var(--surf);border-radius:22px;padding:16px;text-align:center;box-shadow:0 4px 12px var(--sh)}
.pixbox p{font-size:13px;margin-bottom:8px}.pixbox img{width:220px;max-width:70%;border-radius:12px;background:#fff;padding:8px;margin:4px auto 10px;display:block}
.pixbox .in{font-size:11px;text-align:center;margin-bottom:8px}
.card.hl{box-shadow:0 0 0 2px var(--pk),0 6px 16px var(--sh)}
.lp{background:linear-gradient(135deg,var(--pk),var(--pk2));color:#fff;font-size:11px;font-weight:800;letter-spacing:0;border-radius:99px;padding:3px 9px;margin-left:8px;align-self:center}
.sm{background:var(--surf);border-radius:22px;padding:4px 14px;margin:0 0 12px;box-shadow:0 3px 8px var(--sh)}
.sm div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--pl);font-size:13px}.sm div:last-child{border:0}.sm span{color:var(--mut)}.sm b{text-align:right}
.pd{background:var(--surf);border-radius:18px;padding:12px 14px;margin-top:10px;font-size:13px;box-shadow:0 3px 8px var(--sh)}.pd summary{font-weight:700;cursor:pointer}.pd ul{margin:8px 0 0 16px;padding:0}.pd li{margin-bottom:6px}

.gsb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surf);border-radius:18px;padding:10px 13px;margin-top:8px;box-shadow:0 4px 10px var(--sh);font-weight:700;font-size:13.5px}
.gsb>i{flex:none;width:34px;height:34px;display:block}
.gsb small{display:block;font-weight:400;font-size:11px;color:var(--mut);margin-top:1px;line-height:1.3}
.gsb.dg{background:var(--pl);color:var(--pk2)}.gsb.dg small{color:var(--pk2);opacity:.85}
.gsh{display:flex;gap:12px;align-items:center;background:linear-gradient(150deg,var(--pl),var(--cr));border-radius:22px;padding:14px;margin:12px 0 2px;box-shadow:0 5px 14px var(--sh)}
.gsx{display:flex;align-items:center;gap:10px;margin-bottom:4px}.gsx .hb{padding:0;font-size:18px;flex:none}
.pdz{display:inline-block;background:var(--cr);color:var(--mut);border-radius:99px;padding:1px 8px;font-size:10.5px;font-weight:700}
.pd p{margin-top:8px;color:var(--mut);font-size:12.5px;line-height:1.45}
.hch{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 4px}.hch .ghost[aria-pressed=true]{background:var(--pl);box-shadow:0 0 0 2px var(--pk)}
.btn[disabled]{opacity:.6}
.pd.hq{margin-top:8px}

/* ===== Toque sem destaque azul + rolagem sedosa das bolinhas ===== */
*{-webkit-tap-highlight-color:transparent}
.sts,.hs{overscroll-behavior-x:contain;will-change:scroll-position}
.sts{scroll-snap-type:none}
.st,.st b,.ft{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dn{display:inline-flex;align-items:center;gap:5px;flex:none;font-weight:800;font-size:12px;color:var(--g3);background:var(--cr);border-radius:18px;padding:6px 12px 6px 7px;box-shadow:inset 0 1px 2px #fff6,0 3px 8px var(--sh)}
.dn s{width:20px;height:20px;display:block;text-decoration:none}
.dcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
/* ===== Transições suaves entre abas ===== */
nav button{transition:color .13s ease;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
nav button s{transition:opacity .13s ease}
nav button.pre{color:var(--g3)}nav button.pre s{opacity:1}
nav button.old{color:var(--mut)}nav button.old s{opacity:.75}
@media (prefers-reduced-motion:no-preference){
main.fout{opacity:0;transition:opacity .07s ease}
main.fin{animation:tin .2s ease-out both}
main.fin~nav button[aria-current=page] s{animation:navin .2s ease-out both}
.toast.tf{animation:tf 2.8s ease both}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes navin{from{opacity:.35;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes tf{0%{opacity:0;transform:translateX(-50%) translateY(10px)}16%{opacity:1;transform:translateX(-50%)}78%{opacity:1;transform:translateX(-50%)}100%{opacity:0;transform:translateX(-50%)}}
}

/* ===== Layout para computador (telas largas) ===== */
@media (min-width:900px){
body{max-width:1120px;font-size:15px;padding-bottom:104px}
body:not([data-tab="home"]):not([data-tab="search"]) main{max-width:680px;margin:0 auto}
header{padding:22px 32px 8px}
.logo{font-size:26px}.logo span{width:36px;height:36px}
.hb{width:44px;height:44px}
main{padding:0 32px}
.search{padding:12px 18px;margin:10px 0 14px}.search input{font-size:15px}
.sts{flex-wrap:wrap;overflow:visible;margin:0;padding:6px 0 16px;gap:10px 14px;scroll-snap-type:none}
.sts::after,.hs::after{display:none}
.st{width:74px;font-size:11.5px}.st b{width:58px;height:58px;padding:12px}
.hero{padding:34px 40px;border-radius:32px}
.hero h1{font-size:42px;max-width:55%}.hero p{font-size:15px;max-width:48%;margin:10px 0 18px}
.hero .f{width:150px!important;right:48px!important;top:22px!important}

.ft{width:calc(20% - 12px);min-height:150px}
.sec h3{font-size:19px}
.lst{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lst .card{margin:0}.lst .empty{grid-column:1/-1}
.card:hover,.ft:hover,.gsb:hover{transform:translateY(-2px);transition:transform .15s}
.tabs button{padding:8px 18px;font-size:13.5px}
nav{width:min(640px,100%)}
.sheet{align-items:center}
.sheet>div{width:min(560px,100%);max-height:86vh;border-radius:28px}
.toast{bottom:104px}
}
@media (min-width:1300px){
.lst{grid-template-columns:repeat(3,1fr)}
}

var LG={priv:["Política de Privacidade",'<p>O Rodinha valoriza a sua privacidade. Esta política descreve, com transparência, como as informações são tratadas na plataforma.</p><h3>Informações coletadas</h3><p>Para criar a sua conta, solicitamos nome, e-mail e senha. Também armazenamos o conteúdo que você optar por publicar, como nome do grupo, descrição, foto, link de convite, curtidas e comentários. Não solicitamos dados além dos necessários ao funcionamento do serviço.</p><h3>Uso das informações</h3><p>Os dados são utilizados exclusivamente para operar o serviço, exibir os grupos divulgados, enviar comunicados essenciais e preservar a segurança da comunidade.</p><h3>Cookies e anúncios</h3><p>Podemos utilizar cookies para aprimorar a sua experiência. Caso venhamos a exibir anúncios, por exemplo por meio do Google AdSense, o Google poderá utilizar cookies para apresentar anúncios com base em visitas anteriores a este e a outros sites.</p><h3>Links de terceiros</h3><p>A plataforma contém links para o WhatsApp e para o Instagram. Não temos controle sobre o conteúdo nem sobre as práticas de privacidade desses serviços.</p><h3>Segurança</h3><p>Adotamos medidas técnicas adequadas para proteger as informações. Embora nenhum sistema seja totalmente isento de riscos, trabalhamos continuamente para preservá-las.</p><h3>Seus direitos</h3><p>Em conformidade com a Lei Geral de Proteção de Dados (LGPD), você pode solicitar acesso, correção ou exclusão dos seus dados. A exclusão da conta pode ser realizada diretamente em Perfil, na seção Segurança.</p><p style="margin-top:8px">Ao utilizar o Rodinha, você declara estar de acordo com esta política.</p>'],termos:["Termos de Uso",'<h3>1. Sobre o Rodinha</h3><p>O Rodinha é uma plataforma para divulgar e encontrar grupos de WhatsApp. Não possuímos vínculo com o WhatsApp nem com a Meta.</p><h3>2. Cadastro</h3><p>O usuário compromete-se a fornecer informações verdadeiras e a manter a confidencialidade de sua senha.</p><h3>3. Conteúdo publicado</h3><p>Cada usuário é responsável pelo grupo, pelo link, pelo texto e pela foto que divulga, declarando possuir o direito de utilizá-los.</p><h3>4. Moderação</h3><p>Para preservar a qualidade e a segurança da comunidade, o Rodinha poderá analisar, ocultar ou remover conteúdos e suspender contas que não observem estes Termos ou as Regras da Comunidade.</p><h3>5. Destaques e recompensas</h3><p>Os destaques são benefícios gratuitos, sem valor monetário, concedidos mediante a participação honesta nas ações promocionais. Condutas desonestas, como contas duplicadas ou convites simulados, poderão resultar no cancelamento dos benefícios e na suspensão da conta.</p><h3>6. Entrada em grupos</h3><p>A participação em qualquer grupo ocorre por conta e risco do usuário. O Rodinha não controla as conversas realizadas dentro deles.</p><h3>7. Alterações</h3><p>Estes Termos poderão ser atualizados a qualquer momento. A continuidade de uso indica concordância com a versão vigente.</p>'],regras:["Regras da Comunidade",'<p>Para manter um ambiente acolhedor e seguro, solicitamos que todos os usuários observem as diretrizes abaixo.</p><h3>Não é permitido divulgar</h3><ul><li>Conteúdo impróprio ou inadequado ao público em geral.</li><li>Condutas hostis, ofensivas ou que desrespeitem outros usuários.</li><li>Práticas enganosas ou que induzam terceiros ao erro.</li><li>Atividades contrárias à legislação vigente.</li><li>Dados pessoais ou imagens de terceiros sem autorização.</li><li>Spam, grupos repetidos ou links que não sejam do WhatsApp.</li></ul><h3>Verificação automática</h3><p>Textos e fotos passam por uma verificação automática antes da publicação. O usuário também confirma estar de acordo com estas regras.</p><h3>Denúncias</h3><p>Em caso de conteúdo inadequado, utilize o botão Denunciar disponível em cada grupo. A reincidência poderá levar ao banimento.</p><h3>Convivência</h3><p>Pedimos cordialidade e respeito em comentários e interações. Gentileza gera gentileza.</p>']};

function setU(se){var id=se&&se.user?se.user.id:null;if((D.owner||null)!==id)resetUser();D.owner=id;D.user=se?{id:se.user.id,email:se.user.email,name:(se.user.user_metadata&&se.user.user_metadata.name)||se.user.email}:null}
async function pull(){try{var r=await sb.from("groups").select("*, comments(user_name,body)").order("created_at",{ascending:false}).limit(300);if(r.data)D.groups=r.data.map(mapG);D.plus=0;D.plusOwners={};try{var po=await sb.rpc("plus_owners");(po.data||[]).forEach(function(x){D.plusOwners[x.user_id]=new Date(x.plus_until).getTime()})}catch(e){}D.groups.forEach(function(g){var u=D.plusOwners[g.owner];if(u&&u>Date.now()){g.plus=true;g.boost=Math.max(g.boost||0,u)}});D.likes=[];D.blocked=[];if(D.user){var pr=await sb.from("profiles").select("boost_credits,ref_code,ig_claimed").eq("id",D.user.id).maybeSingle();if(pr.data){D.credits=pr.data.boost_credits;D.code=pr.data.ref_code;D.ig=pr.data.ig_claimed;try{var ck="rd_cr_"+D.user.id,pv0=localStorage.getItem(ck),igk="rd_igs_"+D.user.id,igp=localStorage.getItem(igk);if(pv0!==null&&D.credits>+pv0&&!(D.ig&&igp==="0")){localStorage.setItem("rd_inv_"+D.user.id,"1");S.invnew=1}localStorage.setItem(ck,D.credits);localStorage.setItem(igk,D.ig?"1":"0");D.inv=!!localStorage.getItem("rd_inv_"+D.user.id)}catch(e){}}var ps=await sb.from("plus_subs").select("*").eq("user_id",D.user.id).maybeSingle();if(ps.data){D.plus=new Date(ps.data.plus_until).getTime();D.plusAnc=ps.data.anchor_day||0}var l=await sb.from("likes").select("group_id");D.likes=(l.data||[]).map(function(x){return x.group_id});var b=await sb.from("blocks").select("blocked_id");D.blocked=(b.data||[]).map(function(x){return x.blocked_id})}}catch(e){}}
function boot(){sb=supabase.createClient(SUPA_URL,SUPA_KEY);load();D.groups=[];D.user=null;D.users=[];D.likes=[];D.blocked=[];draw();sb.auth.getSession().then(function(r){if(S.fg&&S.fg.step==3&&!(r.data&&r.data.session)){S.fg.step=2;fgp();draw()}});sb.auth.onAuthStateChange(function(ev,se){setU(se);setTimeout(function(){pull().then(function(){draw();igCheck();if(S.invnew){S.invnew=0;toast("Seu amigo se cadastrou! Você ganhou 2 destaques 💗")}}).catch(draw)},0)})}
function cloud(op,a,b){if(!CLOUD||!sb)return;var u=D.user&&D.user.id;try{
 if(op=="view")sb.rpc("inc_view",{gid:a}).then(function(){});
 else if(op=="click")sb.rpc("inc_click",{gid:a}).then(function(){});
 else if(op=="out")sb.auth.signOut();
 else if(op=="del")sb.rpc("delete_me").then(function(){sb.auth.signOut()});
 else if(!u)return;
 else if(op=="like")(b?sb.from("likes").insert({user_id:u,group_id:a}):sb.from("likes").delete().match({user_id:u,group_id:a})).then(function(){});
 else if(op=="cm")sb.from("comments").insert({group_id:a,user_id:u,body:b}).then(function(){});
 else if(op=="rep")sb.from("reports").insert({group_id:a,user_id:u,reason:b}).then(function(){});
 else if(op=="blk")sb.from("blocks").insert({user_id:u,blocked_id:a}).then(function(){});
 else if(op=="pub"){var g=a;sb.from("groups").insert({owner:u,name:g.name,cat:g.cat,link:g.link,descr:g.desc,members:g.members,img:g.img||null}).select().single().then(function(r){if(r.error){if(S.gs==g.id){S.gs=null;S.gnew=false}D.groups=D.groups.filter(function(x){return x!==g});var m=r.error.message;toast(/limite/i.test(m)?"Limite de 3 grupos por dia atingido.":/duplicate|unique/i.test(m)?"Esse grupo já foi divulgado.":/permitido/i.test(m)?"Conteúdo não permitido pelas Regras da Comunidade.":"Não foi possível publicar: "+m)}else{var oi=g.id;g.id=r.data.id;if(S.gs==oi){S.gs=g.id;draw()}}})}
 else if(op=="upd"){var g2=a;sb.from("groups").update({name:g2.name,cat:g2.cat,link:g2.link,descr:g2.desc,members:g2.members,img:g2.img||null}).eq("id",g2.id).select().then(function(r){if(r.error||!r.data||!r.data.length){toast(/permitido/i.test((r.error&&r.error.message)||"")?"Conteúdo não permitido pelas Regras da Comunidade.":"Não foi possível salvar. Tente de novo.");pull().then(draw)}})}
 else if(op=="gdel")sb.from("groups").delete().eq("id",a).select().then(function(r){if(r.error||!r.data||!r.data.length){toast("Não foi possível excluir agora. Tente de novo.");pull().then(draw)}});
 else if(op=="pause")sb.from("groups").update({paused:!!b}).eq("id",a).select().then(function(r){if(r.error||!r.data||!r.data.length){toast("Não foi possível alterar agora. Tente de novo.");pull().then(draw)}});
}catch(e){}}
function igCheck(n){n=n||0;if(!CLOUD||!D.user||!sb||S.igb)return;var f;try{f=localStorage.getItem("rd_ig")}catch(e){}if(!f)return;S.igb=1;
 var done=function(){try{localStorage.removeItem("rd_ig")}catch(e){}};
 sb.rpc("ig_claim").then(function(r){S.igb=0;
  if(r.error){done();return toast("Não foi possível confirmar agora. Toque em Seguir para tentar de novo.")}
  if(r.data=="ok"){done();D.ig=true;D.credits=(D.credits||0)+2;crSet(D.credits);pull().then(function(){draw();toast("Obrigado por seguir! Você ganhou 2 destaques.")})}
  else if(r.data=="ja"){done();D.ig=true;draw()}
  else if(r.data=="cedo"){done();toast("Fique um pouquinho mais no Instagram para ganhar o destaque.")}
  else{done();toast("Não foi possível confirmar. Toque em Seguir para tentar de novo.")}
 },function(){S.igb=0})}
document.addEventListener("visibilitychange",function(){if(document.visibilityState=="visible")igCheck()});
try{var rf=new URLSearchParams(location.search).get("ref");if(rf){S.ref=rf.toUpperCase();S.tab="me";S.view="reg"}}catch(e){}
try{var fr=JSON.parse(localStorage.getItem("rd_fg")||"null");if(fr&&CLOUD&&Date.now()-fr.t<36e5){S.fg={step:fr.step,email:fr.email};S.fgv={};S.tab="me";S.view="login"}else localStorage.removeItem("rd_fg")}catch(e){}
window.addEventListener("unhandledrejection",function(e){e.preventDefault();var m=String((e.reason&&e.reason.message)||e.reason||"");S.hb=0;S.fgb=0;S.pixb=0;toast(/fetch|network|load failed/i.test(m)?"Sem conexão. Verifique a internet e tente de novo.":"Algo deu errado. Tente de novo.")});
if(CLOUD)boot();else{load();if(D.user&&!D.user.id)D.user.id=D.user.email;draw()}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
</body>
</html>
